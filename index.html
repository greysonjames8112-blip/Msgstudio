<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MsgStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1017;--panel:#141923;--panel2:#1b2230;--line:#252d3d;--txt:#e9ecf3;--mute:#8791a7;--acc:#f2b35b;--accx:#1a1203;--mine:#2a2414;--danger:#e5484d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.45 'Bricolage Grotesque',system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}
.btn{background:var(--acc);color:var(--accx);font-weight:600;padding:10px 16px;border-radius:10px}
.btn.ghost{background:var(--panel2);color:var(--txt)}
.btn.danger{background:var(--danger);color:#fff}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--panel2)}
.ico:hover{background:var(--line)}
input,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:block;color:var(--mute);font-size:13px;margin:12px 0 4px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#15110a;background-size:cover;background-position:center;flex:none;position:relative}
.dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#3ecf8e;border:2px solid var(--panel)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:99}

/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.card{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.logo{font-size:34px;font-weight:800;letter-spacing:-1px}
.logo b{color:var(--acc)}
.tabs{display:flex;gap:6px;margin:18px 0 4px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;color:var(--mute)}
.tabs .on{background:var(--panel2);color:var(--txt)}
.err{color:var(--danger);min-height:20px;margin:10px 0 4px;font-size:14px}

/* app */
#app{height:100%;display:grid;grid-template-columns:340px 1fr}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{display:flex;align-items:center;gap:10px;padding:14px}
.sh .me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.sh .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sb{padding:0 14px 10px;position:relative}
#results{position:absolute;left:14px;right:14px;top:48px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;z-index:5;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:left}
.row:hover,.row.on{background:var(--panel2)}
.row .t{flex:1;min-width:0}
.row .n{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.row .n small{color:var(--mute);font-weight:400}
.row .p{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--acc);color:var(--accx);border-radius:10px;font-size:12px;font-weight:700;padding:0 7px}
#list{overflow:auto;flex:1}
.empty{color:var(--mute);padding:24px 18px;text-align:center}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#none{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.ch{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.ch .t{flex:1;min-width:0}
.ch .t div:first-child{font-weight:600}
.ch .t div:last-child{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{display:none}
#msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(520px,82%);padding:8px 12px;border-radius:14px;background:var(--panel2);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.m.mine{align-self:flex-end;background:var(--mine);border:1px solid #4a3a16}
.m .who{font-size:12px;font-weight:600;margin-bottom:2px}
.m .time{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:2px}
.m img,.m video{max-width:100%;max-height:340px;border-radius:10px;display:block;margin-bottom:4px}
.m audio{max-width:100%}
.m a.file{display:inline-block;background:var(--bg);padding:8px 12px;border-radius:10px;text-decoration:none;margin-bottom:4px}
.comp{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--line);background:var(--panel)}
.comp textarea{resize:none;max-height:120px;height:42px}

/* modal + call */
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-height:92vh;overflow:auto}
.modal h2{margin-bottom:6px}
.acts{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
#call{position:fixed;inset:0;background:#06080c;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center}
#remote{width:100%;height:100%;object-fit:contain;background:#000;position:absolute;inset:0}
#local{position:absolute;right:16px;top:16px;width:120px;border-radius:12px;border:1px solid var(--line);background:#000;z-index:2;transform:scaleX(-1)}
#cinfo{position:relative;z-index:2;text-align:center;text-shadow:0 2px 12px #000}
#cinfo .av{margin:0 auto 12px}
#cinfo h2{font-size:26px}
#ctl{position:absolute;bottom:32px;display:flex;gap:16px;z-index:3}
#ctl .ico{width:56px;height:56px;font-size:24px;background:#222a3a}
#ctl .ico.off{background:var(--line);opacity:.6}
#ctl .end{background:var(--danger)}

.m{position:relative}
.m.sel{outline:1px solid var(--acc)}
.m.flash{animation:fl 1.2s}
@keyframes fl{0%,60%{background:#3a2f12}}
.rq{border-left:3px solid var(--acc);background:#0003;padding:3px 8px;border-radius:6px;margin-bottom:4px;font-size:13px;color:var(--mute);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rq b{display:block;color:var(--acc);font-size:12px}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx:empty{display:none}
.rxc{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 8px;font-size:13px}
.rxc.mine{border-color:var(--acc)}
.macts{display:none;gap:2px;margin-top:6px;background:var(--bg);border-radius:12px;padding:3px;flex-wrap:wrap}
.m.sel .macts{display:flex}
.macts button{padding:4px 7px;border-radius:9px;font-size:16px}
.macts button:hover{background:var(--panel2)}
.macts [data-reply]{font-size:13px;color:var(--acc)}
#replybar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--panel2);border-top:1px solid var(--line);border-left:3px solid var(--acc);font-size:13px;color:var(--mute)}
#replybar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replybar .ico{width:28px;height:28px;font-size:13px}
.m.gone{color:var(--mute);font-style:italic;background:transparent;border:1px dashed var(--line)}
.macts [data-del]{font-size:13px;color:var(--danger)}
#joinBar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:#2a2414;border-bottom:1px solid #4a3a16}
#joinBar .btn{padding:6px 14px}
#gcall{position:fixed;inset:0;background:#06080c;z-index:80;display:flex;flex-direction:column}
#gTitle{padding:14px 16px;font-weight:600;text-align:center}
#gGrid{flex:1;min-height:0;overflow:auto;display:grid;gap:8px;padding:0 12px 120px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-content:center}
.tile{position:relative;aspect-ratio:4/3;background:#10141d;border-radius:14px;overflow:hidden}
.tile video{position:relative;width:100%;height:100%;object-fit:cover;background:transparent}
.tile.local video{transform:scaleX(-1)}
.tile.voice video{opacity:0}
.tile .tav{position:absolute;inset:0;display:grid;place-items:center}
.tile .nm{position:absolute;left:8px;bottom:8px;background:#000a;padding:2px 8px;border-radius:8px;font-size:13px}
#gctl{position:absolute;bottom:32px;left:0;right:0;display:flex;gap:16px;justify-content:center;z-index:3}
#gctl .ico{width:56px;height:56px;font-size:24px;background:#222a3a}
#gctl .ico.off{background:var(--line);opacity:.6}
#gctl .end{background:var(--danger)}
#fbar{position:fixed;left:0;right:0;bottom:104px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px;z-index:90}
#fbar button{background:#222a3ae6;border:1px solid var(--line);border-radius:16px;padding:5px 14px;font-size:14px}
#fbar button.on{background:var(--acc);color:var(--accx);border-color:var(--acc)}
#local.rear,.tile.local.rear video{transform:none}
#ctl,#gctl{left:0;right:0;justify-content:center;flex-wrap:wrap}
#ctl .ico.live,#gctl .ico.live{background:var(--acc);color:var(--accx)}
@media(max-width:760px){#ctl .ico,#gctl .ico{width:48px;height:48px;font-size:21px}#ctl,#gctl{gap:10px}}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  #main{display:none}
  #app.open #side{display:none}
  #app.open #main{display:flex}
  #back{display:grid}
  #local{width:90px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="auth" hidden>
  <div class="card">
    <div class="logo">msg<b>studio</b></div>
    <div class="tabs"><button id="tLogin" class="on">Log in</button><button id="tReg">Sign up</button></div>
    <label for="aUser">Username</label>
    <input id="aUser" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="aPass">Password</label>
    <input id="aPass" type="password" autocomplete="current-password">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo" style="width:100%">Log in</button>
  </div>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="sh">
      <button class="me" id="meBtn" title="Account settings"><span id="meName"></span></button>
      <button class="ico" id="newGroup" title="New group chat" aria-label="New group chat">👥</button>
    </div>
    <div class="sb">
      <input id="search" placeholder="Type a username to message…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="results" hidden></div>
    </div>
    <div id="list"></div>
  </aside>

  <main id="main">
    <div id="none"><div><div class="logo">msg<b>studio</b></div><p style="margin-top:8px">Search a username to start a chat,<br>or create a group.</p></div></div>
    <section id="chat" hidden>
      <div class="ch">
        <button class="ico" id="back" aria-label="Back">←</button>
        <div id="chAv"></div>
        <div class="t"><div id="chName"></div><div id="chSub"></div></div>
        <button class="ico" id="callA" title="Voice call" aria-label="Voice call">📞</button>
        <button class="ico" id="callV" title="Video call" aria-label="Video call">🎥</button>
      </div>
      <div id="joinBar" hidden><span id="joinTxt"></span><button class="btn" id="joinGo">Join</button></div>
      <div id="msgs"></div>
      <div id="replybar" hidden><span id="rbText"></span><button class="ico" id="rbX" aria-label="Cancel reply">✕</button></div>
      <div class="comp">
        <input type="file" id="file" hidden>
        <button class="ico" id="attach" title="Send a photo, video or file" aria-label="Attach file">📎</button>
        <textarea id="text" rows="1" placeholder="Write a message…"></textarea>
        <button class="btn" id="send">Send</button>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="mSet" hidden><div class="card">
  <h2>Your account</h2>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
    <div id="setAv"></div>
    <div><button class="btn ghost" id="avPick">Change photo</button> <button class="btn ghost" id="avDel">Remove</button></div>
    <input type="file" id="avFile" accept="image/*" hidden>
  </div>
  <label for="sName">Display name</label><input id="sName" maxlength="30">
  <label for="sBio">Bio</label><input id="sBio" maxlength="160">
  <label for="sColor">Accent color</label><input id="sColor" type="color" style="height:42px;padding:4px">
  <div class="acts">
    <button class="btn danger" id="logout" style="margin-right:auto">Log out</button>
    <button class="btn ghost" data-close>Cancel</button><button class="btn" id="sSave">Save</button>
  </div>
</div></div>

<div class="modal" id="mGrp" hidden><div class="card">
  <h2>New group chat</h2>
  <label for="gName">Group name</label><input id="gName" maxlength="40">
  <label for="gMem">Usernames, separated by commas</label><input id="gMem" placeholder="sam, jo, riley" autocapitalize="off">
  <div class="err" id="gErr"></div>
  <div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="gGo">Create group</button></div>
</div></div>

<div class="modal" id="mIn" hidden><div class="card" style="text-align:center">
  <div id="inAv" style="display:flex;justify-content:center;margin-bottom:12px"></div>
  <h2 id="inWho"></h2><p id="inKind" style="color:var(--mute)"></p>
  <div class="acts" style="justify-content:center"><button class="btn danger" id="inNo">Decline</button><button class="btn" id="inYes">Answer</button></div>
</div></div>

<div id="call" hidden>
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="cinfo"><div id="cAv"></div><h2 id="cWho"></h2><p id="cState"></p></div>
  <div id="ctl">
    <button class="ico" id="cMute" aria-label="Mute microphone">🎤</button>
    <button class="ico" id="cCam" aria-label="Turn camera off">📷</button>
    <button class="ico" id="cFlip" aria-label="Flip camera" hidden>🔄</button>
    <button class="ico" id="cShare" aria-label="Share screen" hidden>🖥️</button>
    <button class="ico" id="cFx" aria-label="Video filters">🎨</button>
    <button class="ico end" id="cEnd" aria-label="End call">📵</button>
  </div>
</div>

<div id="gcall" hidden>
  <div id="gTitle"></div>
  <div id="gGrid"></div>
  <div id="gctl">
    <button class="ico" id="gMute" aria-label="Mute microphone">🎤</button>
    <button class="ico" id="gCam" aria-label="Turn camera off">📷</button>
    <button class="ico" id="gFlip" aria-label="Flip camera" hidden>🔄</button>
    <button class="ico" id="gShare" aria-label="Share screen" hidden>🖥️</button>
    <button class="ico" id="gFx" aria-label="Video filters">🎨</button>
    <button class="ico end" id="gEnd" aria-label="Leave call">📵</button>
  </div>
</div>
<div id="fbar" hidden>
  <button class="on" data-f="none">Original</button><button data-f="gray">Mono</button><button data-f="sepia">Sepia</button><button data-f="warm">Warm</button><button data-f="cool">Cool</button><button data-f="vivid">Vivid</button><button data-f="invert">Invert</button><button data-f="blur">Blur</button>
</div>
<div id="toast" hidden></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const socket = io();
let me = null, convs = {}, msgs = {}, active = null, call = null, incoming = null, replyTo = null, gcall = null;

const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linkify = (t) => esc(t).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g, (u) => {
  const tail = (u.match(/[.,!?;:)]+$/) || [''])[0];
  if (tail) u = u.slice(0, -tail.length);
  const href = u.startsWith('www.') ? 'https://' + u : u;
  return `<a href="${href}" target="_blank" rel="noopener noreferrer">${u}</a>${tail}`;
});
const toast = (t) => { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 3200); };
const ago = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const av = (u, size = 42) => {
  const bg = u.avatar ? `background-image:url(${u.avatar})` : `background:${u.color}`;
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${size / 2.3}px;${bg}">${u.avatar ? '' : esc((u.displayName || u.username)[0].toUpperCase())}${u.online ? '<i class="dot"></i>' : ''}</div>`;
};
const groupAv = (size = 42) => `<div class="av" style="width:${size}px;height:${size}px;font-size:${size / 2.2}px;background:var(--line);color:var(--txt)">👥</div>`;

/* ---------- auth ---------- */
let mode = 'login';
const setMode = (m) => {
  mode = m;
  $('#tLogin').classList.toggle('on', m === 'login'); $('#tReg').classList.toggle('on', m === 'register');
  $('#aGo').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#aErr').textContent = '';
};
$('#tLogin').onclick = () => setMode('login');
$('#tReg').onclick = () => setMode('register');
const submitAuth = () => socket.emit(mode, { username: $('#aUser').value, password: $('#aPass').value }, (r) => {
  if (r.error) return ($('#aErr').textContent = r.error);
  localStorage.setItem('msgstudio_token', r.token);
  boot(r);
});
$('#aGo').onclick = submitAuth;
$('#aPass').onkeydown = (e) => { if (e.key === 'Enter') submitAuth(); };

socket.on('connect', () => {
  const t = localStorage.getItem('msgstudio_token');
  if (!t) return showAuth();
  socket.emit('resume', t, (r) => { if (r.ok) boot(r); else { localStorage.removeItem('msgstudio_token'); showAuth(); } });
});
const showAuth = () => { $('#auth').hidden = false; $('#app').hidden = true; };

function boot(r) {
  me = r.me;
  $('#auth').hidden = true; $('#app').hidden = false;
  renderMe();
  socket.emit('list', null, (res) => {
    const old = convs; convs = {};
    res.convs.forEach((c) => { c.unread = old[c.id]?.unread || 0; convs[c.id] = prep(c); });
    renderList();
    if (active && convs[active]) openConv(active);
  });
}
const renderMe = () => { $('#meBtn').innerHTML = av(me, 40) + `<span id="meName">${esc(me.displayName)}</span>`; };

/* ---------- conversations ---------- */
function prep(c) {
  c.other = c.type === 'dm' ? c.members.find((m) => m.username !== me.username) : null;
  c.title = c.type === 'dm' ? c.other.displayName : c.name;
  c.unread = c.unread || convs[c.id]?.unread || 0;
  return c;
}
function renderList() {
  const arr = Object.values(convs).sort((a, b) => (b.last?.ts || 0) - (a.last?.ts || 0));
  $('#list').innerHTML = arr.length ? arr.map((c) => {
    const l = c.last;
    const prev = l ? (l.from === me.username ? 'You: ' : c.type === 'group' ? l.from + ': ' : '') + (l.text || '📎 ' + l.file) : 'No messages yet';
    return `<button class="row ${c.id === active ? 'on' : ''}" data-id="${esc(c.id)}">${c.type === 'dm' ? av(c.other) : groupAv()}
      <div class="t"><div class="n"><span>${esc(c.title)}</span><small>${l ? ago(l.ts) : ''}</small></div>
      <div class="p">${esc(prev)}</div></div>${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</button>`;
  }).join('') : '<div class="empty">No chats yet. Type a username above to start one.</div>';
}
$('#list').onclick = (e) => { const b = e.target.closest('.row'); if (b) openConv(b.dataset.id); };

function openConv(id) {
  active = id; convs[id].unread = 0; replyTo = null; $('#replybar').hidden = true;
  $('#app').classList.add('open');
  $('#none').hidden = true; $('#chat').hidden = false;
  const c = convs[id];
  $('#chAv').innerHTML = c.type === 'dm' ? av(c.other, 40) : groupAv(40);
  $('#chName').textContent = c.title;
  refreshSub();
  $('#callA').hidden = $('#callV').hidden = false; paintJoin();
  $('#msgs').innerHTML = '';
  socket.emit('history', { id }, (r) => { if (r.error || active !== id) return; msgs[id] = r.messages; r.messages.forEach((m) => addMsg(m, false)); scroll(); });
  renderList();
}
const scroll = () => { const e = $('#msgs'); e.scrollTop = e.scrollHeight; };

function addMsg(m, stick = true) {
  const c = convs[active], mine = m.from === me.username;
  const u = c.members.find((x) => x.username === m.from);
  let body = '';
  if (m.file) {
    const d = m.file.data;
    if (/^data:image\//.test(d)) body += `<img src="${d}" alt="${esc(m.file.name)}">`;
    else if (/^data:video\//.test(d)) body += `<video controls src="${d}"></video>`;
    else if (/^data:audio\//.test(d)) body += `<audio controls src="${d}"></audio>`;

/* ---------- video filters (sent to everyone on the call) ---------- */
const FILTERS = { none: '', gray: 'grayscale(1)', sepia: 'sepia(.9)', warm: 'sepia(.35) saturate(1.6) brightness(1.05)', cool: 'saturate(1.3) hue-rotate(170deg)', vivid: 'saturate(2.2) contrast(1.1)', invert: 'invert(1)', blur: 'blur(7px)' };
const fx = { name: 'none', track: null, timer: null, vid: null };
const activeStream = () => (call && call.stream) || (gcall && gcall.stream);
const allPcs = () => (call ? [call.pc] : gcall ? Object.values(gcall.peers).map((p) => p.pc) : []);
function sendTrack(t, pcs = allPcs()) {
  pcs.forEach((pc) => pc.getSenders().forEach((s) => { if (s.track && s.track.kind === 'video') s.replaceTrack(t).catch(() => {}); }));
  const v = call ? $('#local') : gcall && gcall.local && gcall.local.querySelector('video');
  if (v) v.srcObject = new MediaStream([t]);
}
function startFx(raw) {
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.srcObject = new MediaStream([raw]); v.play().catch(() => {});
  const st = raw.getSettings(), cv = document.createElement('canvas');
  cv.width = st.width || 640; cv.height = st.height || 480;
  const ctx = cv.getContext('2d');
  fx.timer = setInterval(() => { ctx.filter = FILTERS[fx.name] || 'none'; ctx.drawImage(v, 0, 0, cv.width, cv.height); }, 40);
  fx.track = cv.captureStream(25).getVideoTracks()[0]; fx.vid = v;
}
function stopFx() {
  clearInterval(fx.timer); fx.timer = null;
  if (fx.track) fx.track.stop();
  if (fx.vid) fx.vid.srcObject = null;
  fx.track = fx.vid = null;
}
function applyFilter(name) {
  const st = activeStream(), raw = st && st.getVideoTracks()[0];
  if (!raw) return toast('Filters only work in video calls');
  if (name !== 'none' && !('filter' in CanvasRenderingContext2D.prototype)) return toast('Filters need Chrome, Edge or Firefox');
  fx.name = name;
  if (name === 'none') stopFx(); else if (!fx.timer) startFx(raw);
  sendTrack(current());
  document.querySelectorAll('#fbar button').forEach((b) => b.classList.toggle('on', b.dataset.f === name));
}
function resetFx() {
  stopFx(); fx.name = 'none'; $('#fbar').hidden = true;
  if (sharing) { sharing.track.onended = null; sharing.track.stop(); sharing = null; }
  facing = 'user'; paintShare(); paintMirror();
  document.querySelectorAll('#fbar button').forEach((b) => b.classList.toggle('on', b.dataset.f === 'none'));
}
$('#fbar').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) applyFilter(b.dataset.f); };
$('#gFx').onclick = $('#cFx').onclick = () => { $('#fbar').hidden = !$('#fbar').hidden; };

/* ---------- camera flip + screen sharing ---------- */
let facing = 'user', sharing = null;
const cam = () => { const s = activeStream(); return s && s.getVideoTracks()[0]; };
const current = () => (sharing ? sharing.track : fx.track || cam());
const multiCam = async () => (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput').length > 1;
async function paintCallBtns(video) {
  $('#cShare').hidden = $('#gShare').hidden = !(video && navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  $('#cFlip').hidden = $('#gFlip').hidden = true;
  if (video && (await multiCam().catch(() => false))) $('#cFlip').hidden = $('#gFlip').hidden = false;
}
function paintMirror() {
  const flat = !!sharing || facing === 'environment';
  $('#local').classList.toggle('rear', flat);
  if (gcall && gcall.local) gcall.local.classList.toggle('rear', flat);
}
const paintShare = () => document.querySelectorAll('#cShare,#gShare').forEach((b) => b.classList.toggle('live', !!sharing));
async function flipCamera() {
  const st = activeStream(), old = cam();
  if (!old) return toast('Flip works in video calls');
  const was = old.getSettings();
  let tries;
  if (was.facingMode) {
    const f = was.facingMode === 'environment' ? 'user' : 'environment';
    tries = [{ facingMode: { ideal: f } }, { facingMode: { ideal: was.facingMode } }];
  } else {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
    const i = cams.findIndex((d) => d.deviceId === was.deviceId);
    tries = [{ deviceId: { exact: cams[(i + 1) % cams.length].deviceId } }, { deviceId: { exact: was.deviceId } }];
  }
  const enabled = old.enabled;
  old.stop(); // phones often can't open two cameras at once
  let nt;
  for (const v of tries) {
    try { nt = (await navigator.mediaDevices.getUserMedia({ video: { ...v, width: { ideal: 640 }, height: { ideal: 480 } } })).getVideoTracks()[0]; break; } catch {}
  }
  if (!nt) return toast('Camera unavailable');
  nt.enabled = enabled;
  st.removeTrack(old); st.addTrack(nt);
  facing = nt.getSettings().facingMode || 'user';
  if (fx.timer) { stopFx(); startFx(nt); }
  sendTrack(current()); paintMirror();
}
function stopShare() {
  if (!sharing) return;
  sharing.track.onended = null; sharing.track.stop(); sharing = null;
  sendTrack(current()); paintShare(); paintMirror();
}
async function toggleShare() {
  if (sharing) return stopShare();
  if (!cam()) return toast('Start a video call to share your screen');
  let ds;
  try { ds = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch { return; }
  sharing = { track: ds.getVideoTracks()[0] };
  sharing.track.onended = stopShare;
  sendTrack(sharing.track); paintShare(); paintMirror();
}
$('#cFlip').onclick = $('#gFlip').onclick = flipCamera;
$('#cShare').onclick = $('#gShare').onclick = toggleShare;

/* ---------- surprise: confetti when a chat gets a celebration ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95';
  cv.width = innerWidth; cv.height = innerHeight;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d'), cols = ['#f2b35b', '#7c5cff', '#3ecf8e', '#ff6b8b', '#4cc9f0'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[(Math.random() * cols.length) | 0] }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 180) requestAnimationFrame(tick); else cv.remove();
  })();
}

/* ---------- group calls (up to 6 people) ---------- */
const gstate = {};
function paintJoin() {
  const g = active && gstate[active], c = active && convs[active];
  const show = !!(c && c.type === 'group' && g && g.users.length && !(gcall && gcall.id === active));
  $('#joinBar').hidden = !show;
  if (show) $('#joinTxt').textContent = `${g.users.length} in a ${g.video ? 'video' : 'voice'} call`;
}
$('#joinGo').onclick = () => joinGroup(active, false);
socket.on('gcall:state', ({ id, users, video }) => {
  gstate[id] = { users, video };
  if (!users.length && incoming && incoming.group && incoming.id === id) { incoming = null; $('#mIn').hidden = true; }
  paintJoin();
});
socket.on('gcall:ring', ({ id, from, video }) => {
  const c = convs[id], peer = c && c.members.find((m) => m.username === from);
  if (!peer || call || gcall || incoming) return;
  incoming = { group: true, id, peer, video };
  $('#inAv').innerHTML = groupAv(84); $('#inWho').textContent = c.name;
  $('#inKind').textContent = `${peer.displayName} started a group ${video ? 'video' : 'voice'} call`;
  $('#mIn').hidden = false;
});
function addTile(uname, local) {
  const c = convs[gcall.id];
  const u = c.members.find((m) => m.username === uname) || { username: uname, displayName: uname, color: '#888', avatar: '' };
  const t = document.createElement('div');
  t.className = 'tile' + (local ? ' local' : '') + (gcall.video ? '' : ' voice');
  t.innerHTML = `<div class="tav">${av({ ...u, online: false }, 72)}</div><video autoplay playsinline></video><div class="nm">${esc(local ? 'You' : u.displayName)}</div>`;
  if (local) t.querySelector('video').muted = true;
  $('#gGrid').appendChild(t);
  return t;
}
function gPeer(user, offerer) {
  const g = gcall;
  if (g.peers[user]) return g.peers[user];
  const pc = new RTCPeerConnection(ICE);
  const p = (g.peers[user] = { pc, queue: [], tile: addTile(user, false) });
  g.stream.getTracks().forEach((t) => pc.addTrack(t, g.stream));
  if (sharing || fx.track) sendTrack(current(), [pc]);
  pc.onicecandidate = (e) => e.candidate && socket.emit('gcall:signal', { id: g.id, to: user, data: { ice: e.candidate } });
  pc.ontrack = (e) => { p.tile.querySelector('video').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') dropPeer(user); };
  if (offerer) (async () => {
    const o = await pc.createOffer();
    await pc.setLocalDescription(o);

  })();

}
function dropPeer(u) {

  p.pc.close(); p.tile.remove(); delete gcall.peers[u];
}
socket.on('gcall:signal', async ({ id, from, data }) => {
  if (!gcall || gcall.id !== id) return;
  const p = gcall.peers[from] || gPeer(from, false), pc = p.pc;
  if (data.sdp) {
    await pc.setRemoteDescription(data.sdp);
    for (const c of p.queue.splice(0)) await pc.addIceCandidate(c).catch(() => {});
    if (data.sdp.type === 'offer') {
      const a = await pc.createAnswer();
      await pc.setLocalDescription(a);
      socket.emit('gcall:signal', { id, to: from, data: { sdp: pc.localDescription } });
    }
  } else if (data.ice) {
    if (pc.remoteDescription) pc.addIceCandidate(data.ice).catch(() => {}); else p.queue.push(data.ice);
  }

socket.on('gcall:left', ({ id, user }) => { if (gcall && gcall.id === id) dropPeer(user); });
async function joinGroup(id, video) {
  if (call || gcall) return toast('Finish your current call first');
  const c = convs[id]; if (!c) return;
  const room = gstate[id];
  if (room && room.users.length) video = room.video;
  let stream;
  try { stream = await getMedia(video, true); } catch { return toast('Allow microphone' + (video ? ' and camera' : '') + ' access to join'); }
  socket.emit('gcall:join', { id, video }, (r) => {
    if (r.error) { stream.getTracks().forEach((t) => t.stop()); return toast(r.error); }
    gcall = { id, video: r.video, stream, peers: {} };
    $('#gTitle').textContent = c.name + ' · group call';
    $('#gGrid').innerHTML = '';
    gcall.local = addTile(me.username, true);
    gcall.local.querySelector('video').srcObject = stream;
    $('#gCam').hidden = $('#gFx').hidden = !r.video; paintCallBtns(r.video);
    $('#gcall').hidden = false; paintJoin();

}
function leaveGroup() {

}
$('#gEnd').onclick = leaveGroup;

  me = r.me; renderMe(); $('#mSet').hidden = true; toast('Account updated');
});

$('#logout').onclick = () => { localStorage.removeItem('msgstudio_token'); location.reload(); };

$('#newGroup').onclick = () => { $('#gErr').textContent = ''; $('#mGrp').hidden = false; $('#gName').focus(); };
$('#gGo').onclick = () => socket.emit('createGroup', { name: $('#gName').value, members: $('#gMem').value.split(',').filter((x) => x.trim()) }, (r) => {
  if (r.error) return ($('#gErr').textContent = r.error);
  convs[r.conv.id] = prep(Object.assign(r.conv, { unread: 0 }));
  $('#mGrp').hidden = true; $('#gName').value = $('#gMem').value = ''; openConv(r.conv.id);
});

/* ---------- calls (WebRTC, 1-to-1) ---------- */
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const getMedia = (video, small) => navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user', ...(small ? { width: { ideal: 640 }, height: { ideal: 480 } } : {}) } : false });

function buildCall(peer, video, stream) {
  const pc = new RTCPeerConnection(ICE);
  call = { peer, video, stream, pc, queue: [] };
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  pc.onicecandidate = (e) => e.candidate && socket.emit('call:signal', { to: peer.username, data: { ice: e.candidate } });
  pc.ontrack = (e) => { $('#remote').srcObject = e.streams[0]; $('#cState').textContent = ''; if (video) $('#cinfo').hidden = true; };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) endCall(false); };
  $('#local').srcObject = stream; $('#local').hidden = !video;
  $('#cWho').textContent = peer.displayName; $('#cAv').innerHTML = av(peer, 96); $('#cinfo').hidden = false;
  $('#cCam').hidden = $('#cFx').hidden = !video; paintCallBtns(video);
  $('#call').hidden = false;
}
async function startCall(video) {
  const c = convs[active]; if (!c || call || gcall) return;
  if (c.type === 'group') return joinGroup(c.id, video);
  let stream;
  try { stream = await getMedia(video); } catch { return toast('Allow microphone' + (video ? ' and camera' : '') + ' access to call'); }
  socket.emit('call:invite', { to: c.other.username, video }, (r) => {
    if (r.error) { stream.getTracks().forEach((t) => t.stop()); return toast(r.error); }
    buildCall(c.other, video, stream); $('#cState').textContent = 'Calling…';
  });
}
$('#callA').onclick = () => startCall(false);
$('#callV').onclick = () => startCall(true);

socket.on('call:incoming', ({ from, video }) => {
  const peer = Object.values(convs).flatMap((c) => c.members).find((m) => m.username === from);
  if (call || gcall || incoming || !peer) return socket.emit('call:end', { to: from });
  incoming = { peer, video };
  $('#inAv').innerHTML = av(peer, 84); $('#inWho').textContent = peer.displayName;
  $('#inKind').textContent = video ? 'Incoming video call' : 'Incoming voice call';
  $('#mIn').hidden = false;
});
$('#inNo').onclick = () => { if (!incoming.group) socket.emit('call:end', { to: incoming.peer.username }); incoming = null; $('#mIn').hidden = true; };
$('#inYes').onclick = async () => {
  if (incoming.group) { const gi = incoming; incoming = null; $('#mIn').hidden = true; return joinGroup(gi.id, gi.video); }
  const { peer, video } = incoming; incoming = null; $('#mIn').hidden = true;
  let stream;
  try { stream = await getMedia(video); } catch { socket.emit('call:end', { to: peer.username }); return toast('Allow microphone access to answer'); }
  buildCall(peer, video, stream); $('#cState').textContent = 'Connecting…';
  socket.emit('call:accept', { to: peer.username });
};
socket.on('call:accept', async ({ from }) => {
  if (!call || call.peer.username !== from) return;
  $('#cState').textContent = 'Connecting…';
  const offer = await call.pc.createOffer();
  await call.pc.setLocalDescription(offer);
  socket.emit('call:signal', { to: from, data: { sdp: call.pc.localDescription } });
});
socket.on('call:signal', async ({ from, data }) => {
  if (!call || call.peer.username !== from) return;
  const pc = call.pc;
  if (data.sdp) {
    await pc.setRemoteDescription(data.sdp);
    for (const c of call.queue.splice(0)) await pc.addIceCandidate(c).catch(() => {});
    if (data.sdp.type === 'offer') {
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      socket.emit('call:signal', { to: from, data: { sdp: pc.localDescription } });
    }
  } else if (data.ice) {
    if (pc.remoteDescription) pc.addIceCandidate(data.ice).catch(() => {}); else call.queue.push(data.ice);
  }
});
socket.on('call:end', ({ from }) => {
  if (incoming && !incoming.group && incoming.peer.username === from) { incoming = null; $('#mIn').hidden = true; toast('Missed call'); }
  if (call && call.peer.username === from) endCall(false);
});
function endCall(notify = true) {
  if (!call) return;
  if (notify) socket.emit('call:end', { to: call.peer.username });
  call.stream.getTracks().forEach((t) => t.stop());
  call.pc.close(); call = null; resetFx();
  $('#call').hidden = true; $('#remote').srcObject = $('#local').srcObject = null;
  $('#cMute').classList.remove('off'); $('#cCam').classList.remove('off');
}
$('#cEnd').onclick = () => endCall(true);
$('#cMute').onclick = (e) => { const t = call.stream.getAudioTracks()[0]; t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled); };
$('#cCam').onclick = (e) => { const t = call.stream.getVideoTracks()[0]; if (!t) return; t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled); };
</script>
